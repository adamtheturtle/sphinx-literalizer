---
name: Windows ARM release validation

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 156ab7e0c85ab3a8f51c6ca29c9a497b93a06c41
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Run tests using x64 Python
        run: uv run --group=dev pytest -n 2 --cov --cov-config=pyproject.toml .
        env:
          UV_PYTHON: cpython-${{ matrix.python-version }}-windows-x86_64
  lint:
    runs-on: windows-11-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        hook-stage:
          - pre-commit
          - pre-push
          - manual
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 156ab7e0c85ab3a8f51c6ca29c9a497b93a06c41
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: j178/prek-action@v3.1.0
        with:
          prek-version: 0.4.11
          extra-args: >-
            --all-files --hook-stage ${{ matrix.hook-stage }} --verbose
        env:
          UV_NO_CACHE: '1'
          UV_PYTHON: cpython-3.13-windows-x86_64
