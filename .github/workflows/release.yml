---
name: Release

on: workflow_dispatch

jobs:
  build:
    name: Publish a release
    runs-on: ubuntu-latest

    environment: release

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PAT }}
          ref: 7d2611eb70a56856ede48f459eb3cb924a231541
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Select prepared release notes
        id: prepared
        run: |
          echo "release=2026.11.04.1" >> "$GITHUB_OUTPUT"
          cp docs/source/changelog/2026.11.04.1.md release-notes.md

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.prepared.outputs.release }}
          tag_prefix: ''
          commit_sha: 7d2611eb70a56856ede48f459eb3cb924a231541

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          makeLatest: true
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          bodyFile: release-notes.md

      - name: Build a binary wheel and a source tarball
        env:
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          git fetch --tags
          git checkout "$NEW_TAG"
          uv build --sdist --wheel --out-dir dist/
          uv run --group=release check-wheel-contents dist/*.whl

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
