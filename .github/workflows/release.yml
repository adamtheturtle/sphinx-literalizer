---
name: Release source validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release sources (${{ matrix.python-version }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        python-version:
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Test release sources
        run: uv run --group=dev pytest -n 2 --cov --cov-config=pyproject.toml .
        env:
          UV_PYTHON: ${{ matrix.python-version }}
      - name: Check release sources
        if: matrix.python-version == '3.14'
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: |-
          uv run --group=dev ruff check .
          uv run --group=dev ruff format --check .
          uv run --group=dev mypy
          uv run --group=dev ty check
          uv run --group=dev pyright
          uv run --group=dev pyrefly check
          uv run --group=dev pyproject-fmt --check pyproject.toml
