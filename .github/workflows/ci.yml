---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: 0 1 * * *

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          cache-suffix: ${{ matrix.python-version }}-${{ matrix.platform }}
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Run tests
        run: uv run --group=dev pytest -s -vvv --cov --cov-config=pyproject.toml .
        env:
          UV_PYTHON: ${{ matrix.python-version }}

  release-preview:
    name: Validate generated release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Exercise release preparation with a numbered fragment
        env:
          UV_PYTHON: '3.13'
        run: |
          # Keep issue-link formatting covered even with no pending fragments.
          printf '\n%s\n' 'Validate JSON and Sphinx configuration boundaries explicitly instead of relying on casts and ignored type errors.' >> newsfragments/491.change.md
          git add -- newsfragments/491.change.md
          bash ci/assemble-release-notes.sh 9999.01.01
          # Include the generated file in the repository's lint checks.
          git add -- docs/source/changelog newsfragments
      - name: Validate the assembled release tree
        env:
          UV_PYTHON: '3.13'
        run: |
          for stage in pre-commit pre-push manual; do
            uv run --group=dev prek run --all-files --hook-stage "$stage"
          done
          cmp docs/source/changelog/9999.01.01.md release-notes.md

  completion-ci:
    needs: [build, release-preview]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - name: Check validation job status
        run: |-
          if ! ${{ needs.build.result == 'success' && needs.release-preview.result == 'success' }}; then
            echo "One or more validation jobs failed"
            exit 1
          fi
