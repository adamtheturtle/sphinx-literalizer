---
name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: 0 1 * * *

permissions: {}

jobs:
  build:
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14', '3.15']
        # Release branches use ARM runner capacity.
        platform:
          - ${{ startsWith(github.head_ref, 'release/') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
          - ${{ startsWith(github.head_ref, 'release/') && 'windows-11-arm' || 'windows-latest' }}

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          cache-suffix: ${{ matrix.python-version }}-${{ matrix.platform }}
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Run tests
        run: uv run --group=dev pytest -s -vvv --cov --cov-config=pyproject.toml .
        env:
          UV_PYTHON: ${{ matrix.platform == 'windows-11-arm' && format('cpython-{0}-windows-x86_64', matrix.python-version) || matrix.python-version }}

  completion-ci:
    needs: build
    runs-on: ${{ startsWith(github.head_ref, 'release/') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    if: ${{ !cancelled() }}
    steps:
      - name: Check matrix job status
        run: |-
          if ! ${{ needs.build.result == 'success' }}; then
            echo "One or more matrix jobs failed"
            exit 1
          fi
